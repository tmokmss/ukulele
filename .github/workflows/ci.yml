name: CI

# main は deploy.yml が同じ test + build を走らせるので、ここでは重ねない
on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

# 同じブランチに続けて push したら、古い方は止める
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
